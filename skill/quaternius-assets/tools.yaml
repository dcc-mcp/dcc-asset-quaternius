tools:
  - name: search_quaternius_assets
    description: Search Quaternius pack listing by title or tags.
    source_file: scripts/search_quaternius_assets.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: quaternius
    input_schema:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
    output_schema:
      type: object

  - name: inspect_quaternius_asset
    description: Inspect a Quaternius pack page, license, formats, and official download URL.
    source_file: scripts/inspect_quaternius_asset.py
    execution: sync
    affinity: any
    timeout_hint_secs: 20
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: quaternius
    input_schema:
      type: object
      required: ["pack_url_or_slug"]
      properties:
        pack_url_or_slug:
          type: string
    output_schema:
      type: object

